name: Runtime checks and Windows download
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q .
      - name: Test without credentials or external orders
        env:
          LAYLOW_MODE: observe
          OPENAI_API_KEY: ''
          ALPACA_API_KEY: ''
          ALPACA_SECRET_KEY: ''
        run: python -m unittest discover -s tests -v
      - name: Build clean download
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python package_build.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: Laylow-Agency-improved
          path: dist/Laylow-Agency-improved.zip
          if-no-files-found: error
