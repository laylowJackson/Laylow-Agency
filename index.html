<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Command Center</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #050612, #0a0d1d);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      padding: 18px;
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #9da6c9;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      background: #11162b;
      border: 1px solid #29325c;
      border-radius: 14px;
      padding: 15px;
    }

    .label {
      color: #8e99bb;
      font-size: 12px;
    }

    .value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .workers {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .worker {
      background: #0d1224;
      border: 1px solid #252d52;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .worker-name {
      font-weight: bold;
    }

    .worker-sub {
      font-size: 12px;
      color: #8994b5;
      margin-top: 4px;
    }

    .green {
      color: #31f09d;
    }

    .red {
      color: #ff5c79;
    }

    button, select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 8px;
      font-size: 16px;
    }

    select, input {
      background: #0c1124;
      color: white;
      border: 1px solid #29345e;
    }

    button {
      background: #7357ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .danger {
      background: #401526;
      border: 1px solid #742944;
    }

    .log {
      background: #080c19;
      border-radius: 10px;
      padding: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }

    .vault {
      text-align: center;
      background: linear-gradient(135deg, #17112d, #201846);
      border: 1px solid #6f55c7;
      border-radius: 16px;
      padding: 18px;
      margin: 18px 0;
    }

    .vault-value {
      color: #ffd966;
      font-size: 30px;
      font-weight: bold;
    }

    @media (min-width: 700px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Trading Command Center</h1>
  <div class="subtitle">Private paper-trading dashboard</div>

  <div class="stats">

    <div class="card">
      <div class="label">Account Equity</div>
      <div class="value" id="equity">$10,000.00</div>
    </div>

    <div class="card">
      <div class="label">Today P&L</div>
      <div class="value" id="pnl">$0.00</div>
    </div>

    <div class="card">
      <div class="label">Win Rate</div>
      <div class="value" id="winRate">0%</div>
    </div>

    <div class="card">
      <div class="label">Trades</div>
      <div class="value" id="trades">0</div>
    </div>

  </div>

  <div class="vault">
    <div class="label">THE VAULT</div>
    <div class="vault-value" id="vault">$0.00</div>
  </div>

  <h2>Workers</h2>

  <div class="workers" id="workers"></div>

  <div class="card">

    <h2>Paper Trade</h2>

    <label>Symbol</label>

    <select id="symbol">
      <option>SPY</option>
      <option>QQQ</option>
    </select>

    <label>Direction</label>

    <select id="direction">
      <option>CALL</option>
      <option>PUT</option>
    </select>

    <label>Risk Amount</label>

    <input id="risk" type="number" value="50" />

    <label>Daily Loss Limit</label>

    <input id="lossLimit" type="number" value="250" />

    <button onclick="paperTrade()">Run Paper Trade</button>

    <button class="danger" onclick="toggleKill()">
      Kill Switch
    </button>

  </div>

  <h2>Activity</h2>

  <div class="log" id="log">
    Waiting for trade...
  </div>

</div>

<script>

let state = {
  startingBalance: 10000,
  balance: 10000,
  pnl: 0,
  trades: 0,
  wins: 0,
  killed: false
};

let workers = [
  {
    name: "QQQ Momentum",
    sub: "Trend / breakout strategy",
    pnl: 0
  },

  {
    name: "SPY VWAP",
    sub: "Mean-reversion strategy",
    pnl: 0
  },

  {
    name: "QQQ Trend",
    sub: "Trend-following strategy",
    pnl: 0
  },

  {
    name: "Signal Scanner",
    sub: "Scans market setups",
    pnl: 0
  }
];

function money(value) {

  let sign = value < 0 ? "-$" : "$";

  return sign + Math.abs(value).toFixed(2);

}

function renderWorkers() {

  let container = document.getElementById("workers");

  container.innerHTML = "";

  workers.forEach(worker => {

    let div = document.createElement("div");

    div.className = "worker";

    div.innerHTML = `
      <div>
        <div class="worker-name">${worker.name}</div>
        <div class="worker-sub">${worker.sub}</div>
      </div>

      <div class="${worker.pnl >= 0 ? "green" : "red"}">
        ${money(worker.pnl)}
      </div>
    `;

    container.appendChild(div);

  });

}

function updateDashboard() {

  document.getElementById("equity").innerText =
    money(state.balance);

  document.getElementById("pnl").innerText =
    money(state.pnl);

  document.getElementById("vault").innerText =
    money(state.pnl);

  document.getElementById("trades").innerText =
    state.trades;

  let winRate = state.trades
    ? Math.round((state.wins / state.trades) * 100)
    : 0;

  document.getElementById("winRate").innerText =
    winRate + "%";

  document.getElementById("pnl").className =
    "value " + (state.pnl >= 0 ? "green" : "red");

  renderWorkers();

}

function addLog(text) {

  let log = document.getElementById("log");

  let time = new Date().toLocaleTimeString();

  log.innerHTML =
    time + " - " + text + "<br>" + log.innerHTML;

}

function paperTrade() {

  if (state.killed) {

    addLog("Trade blocked. Kill switch is ON.");

    return;

  }

  let symbol =
    document.getElementById("symbol").value;

  let direction =
    document.getElementById("direction").value;

  let risk =
    Number(document.getElementById("risk").value);

  let lossLimit =
    Number(document.getElementById("lossLimit").value);

  if (state.pnl <= -lossLimit) {

    state.killed = true;

    addLog("Daily loss limit reached.");

    return;

  }

  let workerIndex =
    Math.floor(Math.random() * workers.length);

  let win =
    Math.random() < 0.47;

  let result;

  if (win) {

    result =
      risk * (0.5 + Math.random() * 1.5);

  } else {

    result =
      -risk * (0.5 + Math.random() * 0.5);

  }

  result =
    Math.round(result * 100) / 100;

  state.balance += result;

  state.pnl += result;

  state.trades++;

  workers[workerIndex].pnl += result;

  if (win) {
    state.wins++;
  }

  addLog(
    workers[workerIndex].name +
    " | " +
    symbol +
    " " +
    direction +
    " | " +
    money(result)
  );

  updateDashboard();

}

function toggleKill() {

  state.killed =
    !state.killed;

  addLog(
    state.killed
    ? "Kill switch ON."
    : "Trading resumed."
  );

}

updateDashboard();

</script>

</body>
</html>
